<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Солнцекофе — закажи по пути</title>
<meta name="description" content="Закажи кофе заранее и забери без очереди">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --paper:#F2E6D6;
    --paper-dim:#E9D9C3;
    --ink:#4A3B2F;
    --ink-soft:#8F7E6D;
    --amber:#B98450;
    --amber-deep:#8A5D34;
    --mint:#7C9A78;
    --mint-deep:#5C7859;
    --mint-soft:rgba(124,154,120,0.16);
    --coral:#C98B93;
    --coral-deep:#A15D66;
    --coral-soft:rgba(201,139,147,0.16);
    --hairline:rgba(74,59,47,0.12);
    --border:rgba(74,59,47,0.12);
    --card:rgba(255,252,247,0.5);
    --card-strong:rgba(255,252,247,0.75);
    --glass-blur:20px;
    --shadow-col:rgba(90,65,40,0.18);
    --radius-lg:26px;
    --radius-md:18px;
    --radius-sm:13px;
    --sh-sm:0 8px 20px rgba(90,65,40,0.12);
    --sh-md:0 16px 34px rgba(90,65,40,0.16);
    --sh-lg:0 26px 56px rgba(90,65,40,0.20);
    --font-hero:'Playfair Display', serif;
    --font-display:'Plus Jakarta Sans', system-ui, sans-serif;
    --font-body:'Plus Jakarta Sans', system-ui, sans-serif;
    --font-mono:'Roboto Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-body);
    color:var(--ink);
    background:var(--paper);
    min-height:100vh;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
    position:relative;
    overflow-x:hidden;
  }

  .shell{
    position:relative;z-index:1;
    width:100%;max-width:440px;
    min-height:100vh;
    background:transparent;
    display:flex;flex-direction:column;
  }
  @media (min-width:641px){
    .shell{
      min-height:calc(100vh - 56px);
      margin:28px 0;
      border-radius:26px;
      border:1px solid var(--border);
      box-shadow:var(--sh-lg);
      overflow:hidden;
      background:rgba(255,252,247,0.45);
      backdrop-filter:blur(6px);
    }
  }

  .awning{ display:none; }

  .screen{flex:1;display:flex;flex-direction:column;padding-bottom:112px;}

  /* Top bars */
  .topbar{display:flex;align-items:center;gap:10px;padding:16px 18px 8px;}
  .iconbtn{
    width:38px;height:38px;border-radius:50%;border:1px solid var(--border);
    background:var(--card);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex:none;color:var(--ink);font-size:17px;line-height:1;font-weight:700;
    box-shadow:var(--sh-sm); position:relative; overflow:visible;
  }
  .iconbtn:active{transform:scale(0.92)!important;}
  .topbar h2{font-family:var(--font-display);font-size:18px;margin:0;font-weight:700;}

  /* Brand header */
  .brand{padding:18px 18px 4px;}
  .brand-row{display:flex;align-items:center;justify-content:space-between;}
  .brand-mark{display:flex;align-items:center;gap:10px;}
  .badge{
    width:34px;height:34px;border-radius:11px;
    background:var(--amber);
    display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;
  }
  .wordmark{font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:-.02em;}
  .cartbtn{
    position:relative;border:1px solid var(--border);background:var(--ink);color:var(--paper);
    border-radius:999px;padding:9px 14px;display:flex;align-items:center;gap:7px;
    cursor:pointer;font-family:var(--font-body);font-weight:700;font-size:13px;
    box-shadow:var(--sh-sm); overflow:visible;
  }
  .cartbtn:active{transform:scale(0.96)!important;}
  .cartbtn .dot{
    background:var(--amber);color:#fff;border-radius:999px;min-width:18px;height:18px;
    font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 5px;
    font-family:var(--font-mono);font-weight:700;
  }
  .greeting{font-family:var(--font-hero);font-optical-sizing:auto;font-size:26px;font-weight:700;margin:16px 0 4px;line-height:1.2;}
  .mark{
    background:var(--card-strong);
    color:var(--amber-deep); padding:1px 6px;border-radius:5px;box-decoration-break:clone;-webkit-box-decoration-break:clone;
  }
  .subgreeting{color:var(--ink-soft);font-size:13.5px;margin:0 0 16px;line-height:1.5;}

  /* Category tabs */
  .tabs{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px 14px;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--border);
    background:var(--card);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));font-size:12.5px;font-weight:700;color:var(--ink);
    cursor:pointer;white-space:nowrap;position:relative;overflow:hidden;
    transition:background .15s ease, color .15s ease;
  }
  .tab.active{background:var(--amber);color:#fff;}

  /* Menu list */
  .menu-list{padding:2px 18px 12px;display:flex;flex-direction:column;gap:8px;}
  .item-card{
    display:flex;gap:12px;align-items:center;background:var(--card);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));
    border:1px solid var(--border);border-radius:var(--radius-md);padding:12px;
    cursor:pointer;position:relative;overflow:hidden;box-shadow:var(--sh-sm);
  }
  .item-card:active{transform:scale(0.98)!important;background:var(--card-strong);}
  .item-icon{
    width:46px;height:46px;border-radius:13px;border:none;
    display:flex;align-items:center;justify-content:center;flex:none;
    background:var(--card-strong);
  }
  .item-icon svg{width:22px;height:22px;}
  .item-icon img{width:100%;height:100%;object-fit:cover;border-radius:inherit;}
  .item-info{flex:1;min-width:0;}
  .item-info h3{margin:0 0 5px;font-family:var(--font-display);font-size:15.5px;font-weight:700;}
  .item-price{font-family:var(--font-mono);font-size:12.5px;font-weight:600;}
  .item-add{
    width:32px;height:32px;border-radius:50%;border:none;background:var(--amber);
    color:#fff;font-size:18px;font-weight:800;flex:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
  }
  .item-add:active{transform:scale(.85)!important;}

  /* Sticky bottom bar */
  .stickybar{
    position:sticky;bottom:0;left:0;right:0;padding:12px 18px 20px;
    background:var(--paper);
    margin-top:auto;
  }
  .btn-primary{
    width:100%;border:none;border-radius:18px;padding:16px 20px;
    background:var(--amber);
    color:#fff;font-family:var(--font-display);
    font-size:15.5px;font-weight:800;cursor:pointer;display:flex;align-items:center;
    justify-content:space-between;box-shadow:0 10px 22px rgba(138,93,52,0.28);position:relative;overflow:hidden;letter-spacing:-.01em;
  }
  .btn-primary:active{transform:scale(0.98)!important;}
  .btn-primary[disabled]{opacity:.4;pointer-events:none;}
  .btn-primary span.sub{font-family:var(--font-mono);font-weight:600;}

  /* Customize screen */
  .cust-hero{padding:6px 18px 10px;text-align:center;}
  .cust-hero .item-icon{width:70px;height:70px;border-radius:20px;margin:0 auto 12px;background:var(--card-strong);box-shadow:var(--sh-sm);}
  .cust-hero .item-icon svg{width:32px;height:32px;}
  .cust-hero h1{font-family:var(--font-display);font-size:21px;margin:0;}

  .section{padding:12px 18px;}
  .section-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);font-weight:700;margin-bottom:9px;}

  .name-field-card{
    display:flex;align-items:flex-start;gap:12px;padding:14px;border-radius:var(--radius-md);
    background:rgba(185,132,80,0.10);
    border:1px solid rgba(185,132,80,0.28);
  }
  .name-field-icon{
    width:38px;height:38px;border-radius:11px;flex:none;
    background:var(--amber);
    display:flex;align-items:center;justify-content:center;font-size:18px;
  }
  .name-field-label{font-size:14px;font-weight:700;color:var(--ink);}

  .segmented{display:flex;gap:8px;}
  .segmented .seg{
    flex:1;border:1px solid var(--border);background:var(--card);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));border-radius:var(--radius-md);
    padding:9px 6px;text-align:center;cursor:pointer;position:relative;overflow:hidden;
  }
  .segmented .seg.active{background:var(--amber);}
  .segmented .seg .lb{font-family:var(--font-display);font-weight:700;font-size:14px;}
  .segmented .seg .sb{font-size:10px;color:var(--ink-soft);margin-top:1px;font-family:var(--font-mono);text-transform:uppercase;}
  .segmented .seg.active .lb, .segmented .seg.active .sb{color:#fff;}

  .opt-list{display:flex;flex-direction:column;gap:7px;}
  .opt-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    border:1px solid var(--border);background:var(--card);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));border-radius:var(--radius-md);
    padding:11px 13px;cursor:pointer;position:relative;overflow:hidden;
  }
  .opt-row.active{background:var(--mint-soft);border-color:var(--mint);}
  .opt-left{display:flex;align-items:center;gap:10px;}
  .radio{width:17px;height:17px;border-radius:50%;border:1px solid var(--border);flex:none;position:relative;background:var(--card);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));}
  .opt-row.active .radio{border-color:var(--mint);background:var(--card-strong);}
  .opt-row.active .radio::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--mint);}
  .opt-name{font-size:13.5px;font-weight:600;}
  .opt-delta{font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);}
  .opt-row.active .opt-delta{color:var(--mint-deep);}

  .foam-row{
    display:flex;align-items:center;justify-content:space-between;
    border:1px solid var(--border);background:var(--card);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));border-radius:var(--radius-md);
    padding:11px 13px;cursor:pointer;position:relative;overflow:hidden;
  }
  .foam-left{display:flex;flex-direction:column;gap:2px;}
  .foam-left b{font-size:13.5px;}
  .foam-left span{font-size:11px;color:var(--ink-soft);}
  .switch{width:42px;height:24px;border-radius:7px;background:var(--paper-dim);border:1px solid var(--border);position:relative;cursor:pointer;flex:none;overflow:visible;}
  .switch.on{background:var(--mint);}
  .switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:4px;background:var(--ink);transition:left .16s cubic-bezier(.3,1.4,.4,1);}
  .switch.on::after{left:20px;background:#fff;}

  .qty-row{display:flex;align-items:center;justify-content:center;gap:18px;padding:6px 0 2px;}
  .qty-btn{
    width:38px;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--card);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));
    font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-sm);
    font-family:var(--font-display);font-weight:700;position:relative;overflow:hidden;
  }
  .qty-btn:active{transform:scale(0.9)!important;}
  .qty-num{font-family:var(--font-mono);font-size:19px;min-width:24px;text-align:center;font-weight:700;}

  /* Cart screen */
  .cart-line{
    display:flex;gap:11px;background:var(--card);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));border:1px solid var(--border);
    border-radius:var(--radius-lg);padding:11px;align-items:flex-start;
  }
  .cart-line .item-icon{width:42px;height:42px;border-radius:11px;}
  .cart-line .item-icon svg{width:19px;height:19px;}
  .cart-line-info{flex:1;min-width:0;}
  .cart-line-info h4{margin:0 0 3px;font-size:14px;font-family:var(--font-display);}
  .cart-line-info .opts{font-size:10.5px;color:var(--ink-soft);line-height:1.5;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.02em;}
  .cart-line-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none;}
  .cart-line-price{font-family:var(--font-mono);font-weight:700;font-size:13px;}
  .mini-stepper{display:flex;align-items:center;gap:7px;}
  .mini-stepper button{
    width:23px;height:23px;border-radius:7px;border:1px solid var(--border);background:var(--card);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));
    font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;
    position:relative;overflow:hidden;
  }
  .mini-stepper .n{font-family:var(--font-mono);font-size:12px;min-width:14px;text-align:center;font-weight:700;}

  .empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 30px;text-align:center;gap:10px;}
  .empty-state .ico{width:64px;height:64px;border-radius:50%;border:1px solid var(--border);background:var(--amber);display:flex;align-items:center;justify-content:center;font-size:28px;}
  .empty-state h3{font-family:var(--font-display);margin:4px 0 0;font-size:17px;}
  .empty-state p{color:var(--ink-soft);font-size:13px;margin:0 0 8px;}

  /* Loyalty punch card */
  .punch-card{
    background:var(--card);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:14px 15px;box-shadow:var(--sh-sm);
  }
  .punch-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px;}
  .punch-top b{font-family:var(--font-display);font-size:14px;}
  .punch-top span{font-family:var(--font-mono);font-size:11.5px;background:var(--ink);color:var(--amber);padding:2px 8px;border-radius:999px;font-weight:600;}
  .punch-row{display:flex;gap:7px;justify-content:space-between;}
  .punch{
    width:30px;height:30px;border-radius:50%;border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;flex:none;
  }
  .punch.filled{
    border:1px solid var(--border);background:var(--amber);
    transform:rotate(-7deg);
  }
  .punch.filled svg{width:14px;height:14px;}
  .punch-note{font-size:11.5px;color:var(--ink-soft);margin-top:10px;line-height:1.4;}

  .addrcard{
    display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;
    padding:14px;border-radius:var(--radius-md);margin-bottom:10px;
    background:rgba(255,255,255,0.04);border:1px solid var(--border);
  }
  .addrcard:last-child{margin-bottom:0;}
  .addrcard:active{transform:scale(0.98);}
  .addrcard .aicon{
    width:42px;height:42px;border-radius:12px;flex:none;
    background:var(--amber);
    display:flex;align-items:center;justify-content:center;font-size:18px;
  }
  .addrcard .atext{flex:1;min-width:0;}
  .addrcard .atext b{display:block;font-size:13.5px;font-weight:700;line-height:1.3;}
  .addrcard .atext span{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .addrcard .arrow{color:var(--ink-soft);font-size:15px;flex:none;}
  .punch-card.clickable{cursor:pointer;}
  .punch-card.clickable .punch-top::after{content:'Открыть карту →';font-family:var(--font-mono);font-size:10px;color:var(--amber-deep);font-weight:600;}

  /* Member card */
  .member-card{
    background:var(--card);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:18px;box-shadow:var(--sh-md);text-align:center;
  }
  .member-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .member-card-brand{display:flex;align-items:center;gap:7px;font-family:var(--font-display);font-weight:700;font-size:14px;}
  .member-card-tag{font-family:var(--font-mono);font-size:10.5px;background:var(--amber);color:#fff;border:1px solid var(--border);padding:3px 9px;border-radius:999px;font-weight:700;}
  .qr-wrap{
    display:inline-flex;padding:10px;background:#ffffff;border:1px solid var(--border);
    border-radius:var(--radius-md);margin:0 auto 12px;
  }
  .qr-wrap img{display:block;width:180px;height:180px;image-rendering:pixelated;}
  .member-card-id{font-family:var(--font-mono);font-size:19px;font-weight:700;letter-spacing:.04em;}
  .member-card-hint{font-size:12px;color:var(--ink-soft);margin-top:8px;line-height:1.4;max-width:260px;margin-left:auto;margin-right:auto;}
  .member-card-divider{border-top:1px solid var(--border);margin:16px -4px 0;position:relative;}
  .member-card-divider::before, .member-card-divider::after{
    content:'';position:absolute;top:-9px;width:16px;height:16px;border-radius:50%;background:var(--paper);border:1px solid var(--border);
  }
  .member-card-divider::before{left:-14px;}
  .member-card-divider::after{right:-14px;}

  .shop-row{
    display:flex;align-items:center;justify-content:space-between;
    border:1px solid var(--border);background:var(--card);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));border-radius:var(--radius-md);
    padding:11px 13px;cursor:pointer;margin-bottom:8px;position:relative;overflow:hidden;
  }
  .shop-row.active{background:var(--mint-soft);border-color:var(--mint);}
  .shop-row .nm{font-size:13.5px;font-weight:700;}
  .shop-row .ad{font-size:11px;color:var(--ink-soft);margin-top:1px;}

  .pickup-toggle{display:flex;gap:8px;margin-bottom:10px;}
  .pickup-toggle .pt{
    flex:1;text-align:center;padding:10px;border-radius:var(--radius-md);border:1px solid var(--border);
    background:var(--card);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));font-size:12.5px;font-weight:700;cursor:pointer;position:relative;overflow:hidden;
  }
  .pickup-toggle .pt.active{background:var(--mint-soft);color:var(--mint-deep);border-color:var(--mint);}
  .time-input{
    width:100%;border:1px solid var(--border);background:var(--card);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));border-radius:var(--radius-md);
    padding:10px 13px;font-family:var(--font-mono);font-size:13.5px;color:var(--ink);
  }

  .receipt{border-top:1px solid var(--border);margin-top:6px;padding-top:10px;}
  .summary-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;color:var(--ink-soft);font-family:var(--font-mono);}
  .summary-row.total{font-size:16px;font-weight:700;color:var(--ink);padding-top:8px;margin-top:4px;border-top:1px solid var(--border);font-family:var(--font-display);}

  .pay-row{
    display:flex;align-items:center;gap:11px;border:1px solid var(--border);background:var(--card);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));
    border-radius:var(--radius-md);padding:12px 13px;cursor:pointer;margin-bottom:8px;position:relative;overflow:hidden;
  }
  .pay-row.active{background:var(--mint-soft);border-color:var(--mint);}
  .pay-row .pico{width:30px;height:30px;border-radius:9px;border:1px solid var(--border);background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none;}
  .pay-row .plabel{font-size:13.5px;font-weight:600;flex:1;}
  .text-input{
    width:100%;border:1px solid var(--border);background:var(--card);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));border-radius:var(--radius-md);
    padding:11px 13px;font-family:var(--font-body);font-size:13.5px;color:var(--ink);
  }

  /* Status screen */
  .status-top{padding:20px 18px 2px;}
  .status-eyebrow{
    display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--mint-deep);font-weight:700;background:var(--mint-soft);border:none;
    padding:5px 11px;border-radius:999px;
  }
  .eta-hero{padding:20px 22px 4px;}

  .waiting-accept{ padding:34px 26px 10px; text-align:center; }
  .waiting-spinner{
    width:54px;height:54px;margin:0 auto 18px;border-radius:50%;
    border:4px solid var(--border); border-top-color:var(--amber);
    animation:waitspin 0.9s linear infinite;
  }

// Resizes/compresses an uploaded image client-side to a small JPEG data URL —
// stored directly in Firebase (no separate file storage needed to set up).
function readFileAsCompressedDataURL(file, maxSize, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>h){ if(w>maxSize){ h = Math.round(h*maxSize/w); w = maxSize; } }
        else { if(h>maxSize){ w = Math.round(w*maxSize/h); h = maxSize; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality || 0.75));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function moscowParts(){
  // Compute Moscow wall-clock time regardless of the visitor's own timezone.
  const utcMs = Date.now() + (new Date()).getTimezoneOffset()*60000;
  const msk = new Date(utcMs + 3*60*60*1000);
  return { day: msk.getDay(), hour: msk.getHours(), minute: msk.getMinutes() };
}
function shopStatus(shopId){
  const hours = SHOP_HOURS[shopId];
  if(!hours) return { open:true };
  const { day, hour, minute } = moscowParts();
  const isWeekend = (day===0 || day===6);
  const [openH, closeH] = isWeekend ? hours.weekend : hours.weekday;
  const nowMin = hour*60+minute;
  const open = nowMin >= openH*60 && nowMin < closeH*60;
  const fmt = h => String(h).padStart(2,'0') + ':00';
  return { open, opensAt: fmt(openH), closesAt: fmt(closeH), isWeekend };
}

/* ---------- MICRO-INTERACTIONS ---------- */
function spawnRipple(el, x, y){
  const rect = el.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height) * 1.6;
  const span = document.createElement('div');
  span.className = 'ripple-fx';
  span.style.width = span.style.height = size+'px';
  span.style.left = (x - size/2) + 'px';
  span.style.top = (y - size/2) + 'px';
  document.body.appendChild(span);
  requestAnimationFrame(()=>span.classList.add('go'));
  setTimeout(()=>span.remove(), 520);
}
document.addEventListener('pointerdown', (e)=>{
  const el = e.target.closest('.rippleable');
  if(!el) return;
  spawnRipple(el, e.clientX, e.clientY);
});

function flyToCart(startEl){
  const startRect = startEl.getBoundingClientRect();
  const startX = startRect.left + startRect.width/2;
  const startY = startRect.top + startRect.height/2;
  const dot = document.createElement('div');
  dot.className = 'fly-dot';
  dot.style.left = startX+'px';
  dot.style.top = startY+'px';
  document.body.appendChild(dot);
  const cartBtn = document.querySelector('.cartbtn');
  if(cartBtn){
    const cr = cartBtn.getBoundingClientRect();
    const endX = cr.left + cr.width/2;
    const endY = cr.top + cr.height/2;
    requestAnimationFrame(()=>{
      dot.style.transform = `translate(${endX-startX}px, ${endY-startY}px) scale(.25)`;
      dot.style.opacity = '0';
    });
  } else {
    requestAnimationFrame(()=>{
      dot.style.transform = 'translateY(-46px) scale(1.15)';
      dot.style.opacity = '0';
    });
  }
  setTimeout(()=>dot.remove(), 540);
}

  try{
    const res = await fetch(PAYMENT_RELAY_URL + '/create-payment', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(paymentPayload)
    });
    result = await res.json();
  }catch(e){
    result = { ok:false, error:'Не удалось связаться с сервером оплаты.' };
  }

  state.payingNow = false;

  if(!result || !result.ok){
    state.checkoutError = (result && result.error) || 'Не получилось начать оплату — попробуйте ещё раз.';
    render();
    return;
  }

  // Stash enough to resume once we're bounced back from the bank's payment page.
  try{
    localStorage.setItem('sk_pending_payment', JSON.stringify({
      orderId: result.orderId, number, shop, pickupLabel, cartSnapshot, total, startedAt: Date.now()
    }));
  }catch(e){}

  window.location.href = result.paymentUrl;
  return;
}

  const parts = [SIZE_META[l.sizeId] ? SIZE_META[l.sizeId].label : null];

  return parts.filter(Boolean).join(' · ');

const LOYALTY_GOAL = 7;

// ---------- Колесо удачи ----------
// `type` is deliberately generic so a future "partner offer" prize (with a
// url/partner name) can slot in later without changing the spin/voucher logic.
// These are just the *defaults* — admin can edit/add/remove prizes; whatever's
// saved in Firebase (/wheel_prizes) always wins once loaded.
const DEFAULT_WHEEL_PRIZES = [
  { id:'stamp1',   label:'+1 штамп',            emoji:'⭐', weight:28, type:'stamp',     value:1,  color:'#B98450' },
  { id:'syrup',    label:'Сироп в подарок',     emoji:'🍯', weight:24, type:'free_item', value:'Сироп на выбор',      color:'#7C9A78' },
  { id:'disc5',    label:'Скидка 5%',           emoji:'🎫', weight:20, type:'discount',  value:5,  color:'#C98B93' },
  { id:'dessert',  label:'ПП-десерт в подарок', emoji:'🍰', weight:14, type:'free_item', value:'ПП-десерт',           color:'#B98450' },
  { id:'disc10',   label:'Скидка 10%',          emoji:'🎉', weight:10, type:'discount',  value:10, color:'#7C9A78' },
  { id:'coffee',   label:'Бесплатный кофе!',    emoji:'☕', weight:4,  type:'free_item', value:'Классический кофе (M)', color:'#C98B93' },
];
let WHEEL_PRIZES = DEFAULT_WHEEL_PRIZES.slice();

async function loadWheelPrizes(){
  try{
    const res = await fetch(DB_URL + '/wheel_prizes.json');
    const obj = await res.json();
    if(obj && Object.keys(obj).length){
      WHEEL_PRIZES = Object.keys(obj).map(id=>Object.assign({id}, obj[id]));
    }
  }catch(e){ /* keep defaults */ }
}

function buildWheelSVG(){
  const n = WHEEL_PRIZES.length;
  const seg = 360/n;
  const r = 110, cx = 120, cy = 120;
  let paths = '';
  WHEEL_PRIZES.forEach((p,i)=>{
    const a0 = (i*seg - 90) * Math.PI/180;
    const a1 = ((i+1)*seg - 90) * Math.PI/180;
    const x0 = cx + r*Math.cos(a0), y0 = cy + r*Math.sin(a0);
    const x1 = cx + r*Math.cos(a1), y1 = cy + r*Math.sin(a1);
    paths += `<path d="M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 0,1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${p.color}" stroke="#F2E6D6" stroke-width="2"/>`;
    const mid = (a0+a1)/2;
    const tx = cx + (r*0.62)*Math.cos(mid), ty = cy + (r*0.62)*Math.sin(mid);
    const rotDeg = (i*seg + seg/2);
    paths += `<text x="${tx.toFixed(2)}" y="${ty.toFixed(2)}" font-size="20" text-anchor="middle" dominant-baseline="middle" transform="rotate(${rotDeg.toFixed(1)} ${tx.toFixed(2)} ${ty.toFixed(2)})">${p.emoji}</text>`;
  });
  return `<svg viewBox="0 0 240 240" width="240" height="240">${paths}<circle cx="120" cy="120" r="16" fill="#F2E6D6" stroke="#B98450" stroke-width="2"/></svg>`;
}

function pickWeightedPrize(){
  const total = WHEEL_PRIZES.reduce((s,p)=>s+p.weight,0);
  let r = Math.random()*total;
  for(const p of WHEEL_PRIZES){ if(r<p.weight) return p; r -= p.weight; }
  return WHEEL_PRIZES[0];
}

async function checkWheelAvailability(){
  if(!LOYALTY_ID) return;
  try{
    const bRes = await fetch(DB_URL + '/guests/' + LOYALTY_ID + '/bonusSpins.json');
    state.wheelBonusSpins = (await bRes.json()) || 0;
  }catch(e){ state.wheelBonusSpins = 0; }
  state.wheelCanSpin = state.wheelBonusSpins > 0;
  try{
    const vRes = await fetch(DB_URL + '/guests/' + LOYALTY_ID + '/vouchers.json');
    const vObj = await vRes.json();
    state.myVouchers = vObj ? Object.keys(vObj).map(id=>Object.assign({id}, vObj[id])) : [];
  }catch(e){ state.myVouchers = []; }

async function spinWheel(){
  if(!state.wheelCanSpin || state.wheelSpinning || !LOYALTY_ID) return;
  state.wheelSpinning = true;
  state.wheelResult = null;
  render();

  const prize = pickWeightedPrize();
  const idx = WHEEL_PRIZES.indexOf(prize);
  const n = WHEEL_PRIZES.length;
  const seg = 360/n;
  const normalize = a => ((a % 360) + 360) % 360;

  // Where the winning segment's centre needs to sit (in degrees) for the
  // fixed pointer at the top to be pointing at it.
  const baseTarget = normalize(-(idx*seg + seg/2) - 90 + (Math.random()*seg*0.5 - seg*0.25));
  const currentMod = normalize(state.wheelRotation || 0);
  let forwardDelta = baseTarget - currentMod;
  if(forwardDelta <= 0) forwardDelta += 360;
  // Always spin forward (never snap backward) by several full turns plus the precise remainder.
  const targetRotation = (state.wheelRotation || 0) + 360*4 + forwardDelta;

  const disc = document.getElementById('wheelDisc');
  if(disc){
    disc.style.transition = 'transform 3.4s cubic-bezier(0.12,0.72,0.15,1)';
    disc.style.transform = `rotate(${targetRotation}deg)`;
  }

  setTimeout(async ()=>{
    // Lock in the final angle *before* any re-render, so the wheel stays exactly
    // where it visually stopped instead of snapping back to 0 on redraw.
    state.wheelRotation = targetRotation;
    try{
      if(state.wheelBonusSpins > 0){
        await fetch(DB_URL + '/guests/' + LOYALTY_ID + '/bonusSpins.json', {
          method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(state.wheelBonusSpins - 1)
        });
      }
      if(prize.type === 'stamp'){
        await awardStamps(LOYALTY_ID, prize.value);
        initLoyalty();
        state.wheelResult = { emoji: prize.emoji, label: prize.label, voucherId: null };
      } else {
        const voucherId = 'W' + Math.random().toString(36).slice(2,7).toUpperCase();
        await fetch(DB_URL + '/guests/' + LOYALTY_ID + '/vouchers/' + voucherId + '.json', {
          method:'PUT', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ label: prize.label, type: prize.type, value: prize.value, wonAt: Date.now(), redeemed:false })
        });
        state.wheelResult = { emoji: prize.emoji, label: prize.label, voucherId };
      }
    }catch(e){}
    state.wheelSpinning = false;
    state.wheelJustWon = true;
    checkWheelAvailability();
  }, 3400);
}

async function rewardReferrer(referrerId, friendId){
  try{
    const refData = await getLoyaltyGuest(referrerId);
    let stamps = (refData.stamps||0) + 1;
    let justRewarded = false;
    if(stamps >= LOYALTY_GOAL){ stamps = 0; justRewarded = true; }
    await fetch(DB_URL + '/guests/' + referrerId + '.json', {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(Object.assign({}, refData, { stamps, justRewarded, lastStampAt: Date.now(), reminded:false }))
    });
    await fetch(DB_URL + '/guests/' + friendId + '.json', {
      method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ referralRewarded: true })
    });
    await fetch(DB_URL + '/guests/' + referrerId + '/referrals/' + friendId + '.json', {
      method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ at: Date.now() })
    });
    if(LOYALTY_ID && referrerId===LOYALTY_ID){ initLoyalty(); loadReferrals(); }
  }catch(e){}
}
// Adds `count` stamps to a guest's card (handles the 7-stamp reward wrap-around,
// and — if this is their very first-ever stamp and they were referred by someone —
// also credits the referrer). Used both by staff manual charging and by automatic
// crediting when a guest completes a self-service order in the app.
async function awardStamps(id, count){
  const data = await getLoyaltyGuest(id);
  const isFirstEverStamp = !data.stamps || data.stamps===0;
  const total = (data.stamps||0) + count;
  const completions = Math.floor(total / LOYALTY_GOAL); // usually 0 or 1, but handle multi-completion just in case
  const justRewarded = completions > 0;
  const stamps = total % LOYALTY_GOAL;
  await fetch(DB_URL + '/guests/' + id + '.json', {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(Object.assign({}, data, { stamps, justRewarded, lastStampAt: Date.now(), reminded:false }))
  });
  if(justRewarded){
    for(let i=0;i<completions;i++){
      await grantFreeCoffeeVoucher(id);
      await addBonusSpin(id);
    }
  }
  if(isFirstEverStamp && data.referredBy && !data.referralRewarded){
    await rewardReferrer(data.referredBy, id);
  }
  return { stamps, justRewarded };
}

// The 7th-stamp reward becomes a redeemable voucher — same shape and same
// staff "Погасить приз" flow as wheel-of-fortune prizes, so we don't need a
// second redemption system.

    });

async function redeemVoucher(){

  const voucherId = (state.redeemVoucherId||'').trim().toUpperCase();
  if(!guestId || !voucherId){ state.redeemMsg='Укажите ID гостя и код приза.'; state.redeemMsgOk=false; render(); return; }
  try{

    if(!voucher){

    } else {

/* ---------- MAIN RENDER ---------- */
function render(){
  const app = document.getElementById('app');
  let html = '';
  if(state.screen==='menu') html = renderMenu();
  else if(state.screen==='customize') html = renderCustomize();
  else if(state.screen==='cart') html = renderCart();
  else if(state.screen==='card') html = renderCard();
  else if(state.screen==='checkout') html = renderCheckout();
  else if(state.screen==='status') html = renderStatus();
  else if(state.screen==='staff') html = renderStaff();
  else if(state.screen==='admin') html = renderAdmin();
  app.innerHTML = html;

  if(state.screen==='status'){
    initStatusTicker();
  }

  const shouldPollOrder = state.screen==='status' && state.order && state.order.firebaseId && state.order.status!=='done' && state.order.status!=='cancelled';
  if(shouldPollOrder){
    ensureOrderStatusPolling();
  } else {
    stopOrderStatusPolling();
  }

  const showingStaffOrders = state.screen==='staff' && state.staffShop && state.staffName;
  if(showingStaffOrders){
    startStaffLiveUpdates();
  } else {
    stopStaffLiveUpdates();
  }
}

let orderStatusPollTimer = null;
function ensureOrderStatusPolling(){
  if(!orderStatusPollTimer){
    orderStatusPollTimer = setInterval(pollOrderStatus, 4000);
  }
}
function stopOrderStatusPolling(){
  clearInterval(orderStatusPollTimer);
  orderStatusPollTimer = null;
}
async function pollOrderStatus(){
  if(!state.order || !state.order.firebaseId || state.screen!=='status'){ stopOrderStatusPolling(); return; }
  try{
    const res = await fetch(DB_URL + '/orders/' + state.order.firebaseId + '.json');
    const o = await res.json();
    if(!o) return;
    const wasStatus = state.order.status;
    if(o.status) state.order.status = o.status;
    if(o.acceptedAt) state.order.acceptedAt = o.acceptedAt;
    if(o.prepMinutes) state.order.prepMinutes = o.prepMinutes;
    saveOrderToStorage();
    if(wasStatus !== state.order.status){
      render();
    }
  }catch(e){}
}

let staffTickTimer = null;
let staffPollTimer = null;
function startStaffLiveUpdates(){
  if(!staffTickTimer){
    staffTickTimer = setInterval(tickStaffOrderTimers, 1000);
  }
  if(!staffPollTimer){
    staffPollTimer = setInterval(()=>{
      if(state.screen==='staff' && state.staffShop && state.staffName) loadStaffOrders(true);
    }, 20000);
  }
}
function stopStaffLiveUpdates(){
  clearInterval(staffTickTimer); staffTickTimer = null;
  clearInterval(staffPollTimer); staffPollTimer = null;
}
function tickStaffOrderTimers(){
  if(!state.staffOrders || !state.staffOrders.length) return;
  const now = Date.now();
  state.staffOrders.forEach(o=>{
    if(o.status!=='accepted' || !o.acceptedAt) return;
    const el = document.getElementById('timer-'+o.id);
    if(!el) return;
    const etaMs = (o.prepMinutes||6)*60000;
    const remainMs = etaMs - (now - o.acceptedAt);
    el.classList.remove('warn','over');
    if(remainMs <= 0){
      const overMin = Math.floor(-remainMs/60000);
      const overSec = String(Math.floor((-remainMs%60000)/1000)).padStart(2,'0');
      el.textContent = `⏰ Просрочен на ${overMin}:${overSec}`;
      el.classList.add('over');
    } else {
      const min = Math.floor(remainMs/60000);
      const sec = String(Math.floor((remainMs%60000)/1000)).padStart(2,'0');
      el.textContent = `⏳ Осталось ${min}:${sec}`;
      if(remainMs <= 120000) el.classList.add('warn');
    }
  });
}


/* ---------- STATUS ANIMATION ---------- */
function initStatusTicker(){
  clearInterval(statusTimer);
  if(!state.order || state.order.status !== 'accepted' || !state.order.acceptedAt) return;
  const eyebrow = document.getElementById('statusEyebrow');
  const etaNum = document.getElementById('etaNum');
  const etaLabel = document.getElementById('etaLabel');
  const progressFill = document.getElementById('progressFill');
  const st = [document.getElementById('st0'), document.getElementById('st1'), document.getElementById('st2')];
  const lines = [document.getElementById('line0'), document.getElementById('line1')];
  const readyBlock = document.getElementById('readyBlock');
  const flowerNote = document.getElementById('flowerNote');
  if(!eyebrow || !st[0]) return;

  const done = [false, false, false];
  let confettiPlayed = false;
  function stamp(idx){
    if(done[idx]) return;
    done[idx] = true;
    st[idx].classList.remove('active');
    st[idx].classList.add('done', 'stamp-in');
    st[idx].innerHTML = checkSVG('#fff');
    setTimeout(()=>st[idx].classList.remove('stamp-in'), 460);
    if(idx>0) lines[idx-1].classList.add('filled');
  }

  const demoDuration = state.order.prepMinutes*60000;
  function tick(){
    const elapsed = Date.now() - state.order.acceptedAt;
    const t = Math.min(1, elapsed / demoDuration);

    if(progressFill) progressFill.style.width = (t*100) + '%';

    if(!done[0]) stamp(0);
    if(t>=0.04 && !done[1]){ st[1].classList.add('active'); }
    if(t>=0.92 && !done[1]) stamp(1);
    if(t>=0.92 && !done[2]) stamp(2);

    if(t<0.04){ eyebrow.textContent='Заказ принят'; }
    else if(t<0.92){ eyebrow.textContent='Готовим ваш заказ'; }
    else { eyebrow.textContent='Готово к выдаче'; }

    const remaining = Math.max(0, Math.round(state.order.prepMinutes*(1-t)));
    if(t<0.92){
      etaNum.innerHTML = (remaining<=0 ? '&lt;1' : `~${remaining}`) + '<span>мин</span>';
      etaLabel.textContent = 'До готовности';
    } else {
      etaNum.innerHTML = 'Готово';
      etaLabel.textContent = 'Заберите заказ';
      readyBlock.classList.add('show');
      flowerNote.classList.add('show');
      if(!confettiPlayed){ confettiPlayed = true; spawnConfetti(readyBlock); }
    }

    if(t>=1){ clearInterval(statusTimer); }
  }
  tick();
  statusTimer = setInterval(tick, 150);
}

  else if(action==='admin-remove-menu-item'){ removeAdminMenuItem(el.dataset.id); }
  else if(action==='admin-save-post'){ saveAdminPost(); }
  else if(action==='admin-save-prize'){ saveAdminPrize(); }
  else if(action==='admin-edit-prize'){
    const p = WHEEL_PRIZES.find(x=>x.id===el.dataset.id);
    if(p){
      state.editingPrizeId = p.id; state.newPrizeLabel = p.label; state.newPrizeEmoji = p.emoji;
      state.newPrizeType = p.type; state.newPrizeValue = String(p.value); state.newPrizeWeight = String(p.weight);
      render();
    }
  }
  else if(action==='admin-cancel-prize-edit'){
    state.editingPrizeId=null; state.newPrizeLabel=''; state.newPrizeEmoji=''; state.newPrizeValue=''; state.newPrizeWeight=''; render();
  }
  else if(action==='admin-remove-prize'){ removeAdminPrize(el.dataset.id); }
  else if(action==='admin-set-stop-cat'){ state.adminStopCat = el.dataset.cat; render(); }
  else if(action==='admin-toggle-stop'){ toggleStopItem(el.dataset.id); }
  else if(action==='admin-edit-item'){
    const i = itemById(el.dataset.id);
    if(i){
      state.editingMenuItemId = i.id;
      state.editItemName = i.name;
      state.editItemIcon = i.icon;
      state.editItemPrices = Object.assign({}, i.sizes);
      state.editItemPhoto = i.photo || null;
      render();
    }
  }
  else if(action==='admin-cancel-item-edit'){ state.editingMenuItemId=null; render(); }
  else if(action==='clear-edit-item-photo'){ state.editItemPhoto=null; render(); }
  else if(action==='admin-save-item-edit'){ saveMenuItemEdit(el.dataset.id); }
  else if(action==='order-accept'){ acceptOrder(el.dataset.id); }
  else if(action==='order-done'){ markOrderDone(el.dataset.id); }
  else if(action==='order-refund'){ refundOrder(el.dataset.id, el.dataset.paymentId); }
});

document.addEventListener('change', (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el || el.type !== 'file') return;
  const file = el.files && el.files[0];
  if(!file) return;
  const action = el.dataset.action;
  if(action==='set-new-menu-photo'){
    readFileAsCompressedDataURL(file, 480, 0.72).then(dataUrl=>{
      state.newMenuPhoto = dataUrl; render();
    }).catch(()=>showToast('Не удалось загрузить фото.'));
  } else if(action==='set-edit-item-photo'){
    readFileAsCompressedDataURL(file, 480, 0.72).then(dataUrl=>{
      state.editItemPhoto = dataUrl; render();
    }).catch(()=>showToast('Не удалось загрузить фото.'));
  } else if(action==='set-shop-photo'){
    uploadShopPhoto(el.dataset.shop, file);
  }
});

  if(!el) return;

  else if(action==='set-guest-name'){ state.guestName = el.value; }
  else if(action==='set-receipt-contact'){ state.receiptContact = el.value; }
  else if(action==='set-tip-custom'){ state.tipCustom = el.value; }
  else if(action==='set-new-staff-name'){ state.newStaffName = el.value; }
  else if(action==='set-new-staff-password'){ state.newStaffPassword = el.value; }
  else if(action==='set-charge-id'){ state.chargeIdValue = el.value; }
  else if(action==='set-new-menu-name'){ state.newMenuName = el.value; }
  else if(action==='set-new-menu-cat'){ state.newMenuCat = el.value; }
  else if(action==='set-new-menu-price'){ state.newMenuPrice = el.value; }
  else if(action==='set-new-menu-icon'){ state.newMenuIcon = el.value; }
  else if(action==='set-edit-item-name'){ state.editItemName = el.value; }
  else if(action==='set-edit-item-icon'){ state.editItemIcon = el.value; }

  else if(action==='set-post-date'){ state.newPostDate = el.value; }

  else if(action==='set-post-photo'){ state.newPostPhoto = el.value; }
  else if(action==='set-prize-label'){ state.newPrizeLabel = el.value; }
  else if(action==='set-prize-emoji'){ state.newPrizeEmoji = el.value; }
  else if(action==='set-prize-type'){ state.newPrizeType = el.value; render(); }
  else if(action==='set-prize-value'){ state.newPrizeValue = el.value; }
  else if(action==='set-prize-weight'){ state.newPrizeWeight = el.value; }
  else if(action==='set-staff-pin'){ state.staffPinValue = el.value; }
  else if(action==='set-admin-pin'){ state.adminPinValue = el.value; }
});

async function loadExtraMenu(){
  try{
    const res = await fetch(DB_URL + '/menu.json');
    const obj = res.ok ? await res.json() : null;
    if(obj){
      EXTRA_ITEMS = Object.keys(obj).map(id=>{
        const m = obj[id];
        return { id: 'x_'+id, dbId:id, category:m.category, name:m.name, sizes:{m:m.price}, hit:!!m.hit, icon:m.icon||'🍽️', photo:m.photo||null, custom:true };
      });
    }
  }catch(e){ /* ignore, menu just stays with built-in items */ }
  await loadMenuOverrides();
  await loadStopList();
  render();
}

async function loadMenuOverrides(){
  try{
    const res = await fetch(DB_URL + '/menu_overrides.json');
    const obj = res.ok ? await res.json() : null;
    MENU_OVERRIDES = obj || {};
  }catch(e){ /* keep whatever we had */ }
}

async function loadStopList(){
  try{
    const res = await fetch(DB_URL + '/stoplist.json');
    const obj = res.ok ? await res.json() : null;
    STOP_LIST = new Set(obj ? Object.keys(obj).filter(k=>obj[k]) : []);
  }catch(e){ /* keep whatever we had */ }
}

async function loadShopPhotos(){
  try{
    const res = await fetch(DB_URL + '/shop_photos.json');
    const obj = res.ok ? await res.json() : null;
    state.shopPhotos = obj || {};
  }catch(e){ /* keep whatever we had */ }
  render();
}

async function uploadShopPhoto(shopId, file){
  try{
    const dataUrl = await readFileAsCompressedDataURL(file, 640, 0.72);
    state.shopPhotos[shopId] = dataUrl;
    render();
    await fetch(DB_URL + '/shop_photos/' + shopId + '.json', {
      method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(dataUrl)
    });
  }catch(e){ showToast('Не удалось загрузить фото — попробуйте другое.'); }
}

async function saveMenuItemEdit(id){
  const name = state.editItemName.trim();
  const icon = state.editItemIcon.trim() || '🍽️';
  const sizes = {};
  Object.keys(state.editItemPrices).forEach(sz=>{
    const p = parseInt(state.editItemPrices[sz], 10);
    if(!isNaN(p) && p>0) sizes[sz] = p;
  });
  if(!name || !Object.keys(sizes).length) return;
  try{
    await fetch(DB_URL + '/menu_overrides/' + id + '.json', {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ name, icon, sizes, photo: state.editItemPhoto || null })
    });
  }catch(e){}
  state.editingMenuItemId = null;
  state.editItemPhoto = null;
  await loadExtraMenu();
}

async function toggleStopItem(itemId){
  const stopped = STOP_LIST.has(itemId);
  try{
    if(stopped){
      await fetch(DB_URL + '/stoplist/' + itemId + '.json', { method:'DELETE' });
    } else {
      await fetch(DB_URL + '/stoplist/' + itemId + '.json', {
        method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(true)
      });
    }
  }catch(e){}
  await loadStopList();
  render();
}

/* ---------- PAYMENT RETURN ---------- */
let paymentConfirmTimer = null;
async function pollPaymentConfirmation(orderId, deadline){
  if(Date.now() > deadline){
    clearInterval(paymentConfirmTimer);
    state.checkoutError = 'Банк долго не подтверждает оплату. Если деньги списались, напишите нам в чат — мы всё проверим.';
    state.screen = 'menu';
    localStorage.removeItem('sk_pending_payment');
    render();
    return;
  }
  try{
    const res = await fetch(DB_URL + '/order_lookup/' + orderId + '.json');
    const realId = await res.json();
    if(realId){
      clearInterval(paymentConfirmTimer);
      const oRes = await fetch(DB_URL + '/orders/' + realId + '.json');
      const o = await oRes.json();
      if(o){
        state.order = Object.assign({}, o, {
          firebaseId: realId,
          shop: SHOPS.find(s=>s.id===o.shopId) || { name:o.shopName, addr:o.shopAddr },
          pickupLabel: o.pickup,
          placedAt: o.createdAt,
        });
        saveOrderToStorage();
        localStorage.removeItem('sk_pending_payment');
        render();
      }
    }
  }catch(e){}
}
function checkPaymentReturn(){
  const params = new URLSearchParams(window.location.search);
  const paidOrderId = params.get('paid');
  const failed = params.get('failed');
  if(!paidOrderId && !failed) return false;

  // Clean the URL so a refresh doesn't repeat this.
  try{
    const url = new URL(window.location.href);
    url.searchParams.delete('paid'); url.searchParams.delete('failed');
    window.history.replaceState({}, '', url);
  }catch(e){}

  if(failed){
    state.checkoutError = 'Оплата не прошла — попробуйте ещё раз.';
    state.screen = 'menu';
    localStorage.removeItem('sk_pending_payment');
    return true;
  }

  let pending = null;
  try{ pending = JSON.parse(localStorage.getItem('sk_pending_payment') || 'null'); }catch(e){}
  state.order = {
    number: pending ? pending.number : '—',
    shop: pending ? pending.shop : SHOPS[0],
    pickupLabel: pending ? pending.pickupLabel : 'Скоро',
    status: 'confirming',
    firebaseId: null,
  };
  state.screen = 'status';
  const deadline = Date.now() + 90000;
  paymentConfirmTimer = setInterval(()=>pollPaymentConfirmation(paidOrderId, deadline), 3000);
  pollPaymentConfirmation(paidOrderId, deadline);
  return true;
}

/* ---------- INIT ---------- */
const cameFromPayment = checkPaymentReturn();
if(!cameFromPayment){
  (function restoreActiveOrder(){
    const saved = loadOrderFromStorage();
    if(!saved) return;
    const elapsedSincePlaced = Date.now() - saved.placedAt;
    const staleAfterMs = (saved.status==='accepted' && saved.prepMinutes) ? saved.prepMinutes*60000 + 20*60000 : 30*60000;
    if(elapsedSincePlaced < staleAfterMs){
      // Order is still pending/cooking (or was ready recently) — jump straight back to it.
      state.order = saved;
      state.screen = 'status';
    } else {
      // Long finished / stale — clean up so it stops showing as "active".
      clearStoredOrder();
    }
  })();
}
loadExtraMenu();
loadWheelPrizes();
loadShopPhotos();
initLoyalty();
render();
</script>
